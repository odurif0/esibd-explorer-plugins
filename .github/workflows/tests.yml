name: tests

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: "Run the full suite, including slow tests and sibling copies"
        type: boolean
        default: false

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      QT_QPA_PLATFORM: offscreen
      ESIBD_REQUIRE_TARGET_HOST: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Qt runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Explorer host and test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Use the installed Explorer as its source tree
        run: echo "ESIBD_EXPLORER_SOURCE=$(python -c 'import esibd, pathlib; print(pathlib.Path(esibd.__file__).parent.parent)')" >> "$GITHUB_ENV"
      - name: Fast suite
        if: ${{ !startsWith(github.ref, 'refs/tags/') && !inputs.full }}
        run: python -m pytest -q -m "not slow"
      - name: Full suite (release)
        if: ${{ startsWith(github.ref, 'refs/tags/') || inputs.full }}
        run: python -m pytest -q --all-siblings
