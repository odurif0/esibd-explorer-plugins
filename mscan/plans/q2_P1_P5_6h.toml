# Second step on the instrument: the stopping cut and the full ladders of P1 and P5 (same RF cycles,
# different f and E). Every key left out takes the value of q2_full.toml.

[map]
name = "q2-P1-P5-6h"
max_lines = 80

[map.design]
amplitude = [[500, 26], [300, 9.4]]
frequency = []

[map.stopping]
x_from_v = 30        # 2026-11-04: x50 = 34.8–37.4 V, widths 0.6–1.1 V
x_to_v = 42

[map.stages]
search = false
validation = false
local = false
best = false
